<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerar PDF de Reembolso</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<div class="container no-print">

  <!-- Painel de Relatórios / Rascunhos Salvos -->
  <div class="card" id="cardRascunhos">
    <h2>
      <span>Relatórios / Rascunhos Salvos <span class="badge" id="badgeRascunhos">0</span></span>
      <button type="button" class="btn-auto" id="btnAtualizarRascunhos" style="width: auto;">Atualizar Lista</button>
    </h2>
    <input type="text" id="buscaRascunhoInput" class="search-box" placeholder="Buscar relatório salvo por nome do paciente, plano, cartão ou observação...">
    <div id="listaRascunhosContainer">
      <div style="font-size: 0.86rem; color: #64748b;">Carregando relatórios salvos...</div>
    </div>
  </div>

  <!-- Dados Principais do Reembolso -->
  <div class="card">
    <h1>
      <span>Gerar PDF de Reembolso</span>
      <span id="tagEditandoRascunho" class="badge hidden" style="background: #dbeafe; color: #1e3a8a;">Editando relatório salvo</span>
    </h1>

    <!-- Barra de Preenchimento (0% Vermelho -> 100% Verde) e Botão Salvar -->
    <div class="progresso-painel">
      <div class="progresso-info">
        <div class="progresso-topo">
          <strong>Preenchimento do Relatório</strong>
          <span class="progresso-pct-badge" id="progressoPctTexto">0%</span>
        </div>
        <div class="progresso-track">
          <div class="progresso-fill" id="progressoBarraFill"></div>
        </div>
        <div class="progresso-faltando" id="progressoFaltandoTexto">Faltam: Plano, Paciente, Cartão, Valor US, Procedimentos, Cirurgião (Nome, CRO, CPF)</div>
      </div>

      <div class="acoes-rascunho">
        <button type="button" class="btn-novo-relatorio" id="btnNovoRelatorio" title="Limpar campos para iniciar um novo paciente">+ Novo</button>
        <button type="button" class="btn-salvar-rascunho" id="btnSalvarRascunho">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
            <polyline points="17 21 17 13 7 13 7 21"></polyline>
            <polyline points="7 3 7 8 15 8"></polyline>
          </svg>
          <span id="textoBtnSalvarRascunho">Salvar Rascunho</span>
        </button>
      </div>
    </div>
    <div id="statusRascunhoSalvo" style="font-size: 0.83rem; color: #166534; font-weight: 600; margin-bottom: 12px;"></div>

    <div class="form-group">
      <label for="planoSelect">Plano de Saúde</label>
      <div style="display: flex; gap: 10px;">
        <select id="planoSelect" style="flex: 1;">
          <option value="">Carregando planos...</option>
        </select>
        <button type="button" class="btn-auto" id="btnRecarregarPlanos" style="padding: 0 14px; width: auto;">Recarregar</button>
      </div>
    </div>

    <div class="row">
      <div class="form-group" style="flex: 2; min-width: 240px;">
        <label for="pacienteInput">Nome Completo do Paciente</label>
        <input type="text" id="pacienteInput" placeholder="Digite o nome completo do paciente">
      </div>

      <div class="form-group" style="flex: 1; min-width: 200px;">
        <label for="cartaoInput">Número do Cartão do Plano</label>
        <input type="text" id="cartaoInput" placeholder="Digite o número da carteirinha">
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label for="multiploInput">Múltiplo de Reembolso</label>
        <input type="text" inputmode="decimal" id="multiploInput" value="1" placeholder="Ex: 1 ou 1,5">
      </div>

      <div class="form-group">
